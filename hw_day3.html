<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses Progress Dashboard</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <style>
      div.progress {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5 text-center">
      <ul class="breadcrumb">
        <li class="breadcrumb-item">Home</li>
        <li class="breadcrumb-item">Courses</li>
        <li class="breadcrumb-item active">Web Devolopement</li>
      </ul>
      <h2>Web Devolopement <span class="badge badge-primary">New</span></h2>

      <div class="progress">
        <div
          class="progress-bar progress-bar-striped bg-success"
          style="width: 100%"
        >
          HTML 100%
        </div>
      </div>
      <div class="progress">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
          style="width: 75%"
        >
          CSS 75%
        </div>
      </div>
      <div class="progress">
        <div class="progress-bar bg-warning" style="width: 50%">
          Javascript 50%
        </div>
      </div>
      <div class="progress">
        <div class="progress-bar bg-danger" style="width: 25%">
          Bootstrap 25%
        </div>
      </div>
      <!-- progress-bar above-->
      <!-- button group below -->
      <div class="row justify-content-center">
        <div class="col-md-8 mt-5">
          <button type="button" class="btn btn-success">Start</button>
          <button type="button" class="btn btn-info">Pause</button>
          <button type="button" class="btn btn-danger">Reset</button>
        </div>
      </div>
      <!-- button group  -->
      <!-- pagination  -->
      <ul class="pagination mt-4 justify-content-center">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </div>
  </body>
</html>
