<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Product Feature Page</title>
  </head>
  <body>
    <div class="container mt-3">
      <div class="row mt-4">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header">Raspberry Pi 5 (8GB)</div>
            <img
              src="https://i0.wp.com/knowledgeelectronics.com/wp-content/uploads/2024/05/Raspberry-pi-5-4GB-2.png?fit=1500%2C1500&ssl=1"
              alt="image of raspberry Pi 5"
            />
            <div class="card-body">
              <p class="card-text">
                The latest generation single-board computer, offering
                desktop-like performance. Ideal for running headless Linux
                setups, computer vision, and advanced robotics.
              </p>
              <a href="#" class="card-link">Read more...</a>
              <div class="dropdown mt-2">
                <button
                  type="button"
                  class="btn btn-info dropdown-toggle"
                  data-toggle="dropdown"
                >
                  More options
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="#">Add to wishlist</a>
                  <a class="dropdown-item" href="#">Compare</a>
                  <a class="dropdown-item" href="#">Report</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
